<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Claude Status: a stack of session rows with the top one lit.
       Reads at 16px as "a list where one item wants you", which is what the
       app is for. Deliberately unlike the template gear every other app uses. -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#1b1815"/>

  <!-- blocked / waiting: the lit row -->
  <rect x="14" y="16" width="8" height="8" rx="4" fill="#f0a52e"/>
  <rect x="27" y="18" width="23" height="4" rx="2" fill="#f0a52e"/>

  <!-- working -->
  <rect x="14" y="30" width="8" height="8" rx="4" fill="#ddd6cc"/>
  <rect x="27" y="32" width="17" height="4" rx="2" fill="#ddd6cc"/>

  <!-- idle -->
  <rect x="14" y="44" width="8" height="8" rx="4" fill="#6b625a"/>
  <rect x="27" y="46" width="12" height="4" rx="2" fill="#6b625a"/>
</svg>
